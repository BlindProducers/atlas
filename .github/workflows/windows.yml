# Builds the Windows x64 VST3 on every push to the Windows branch and adds it
# to the beta pre-release that macos.yml maintains (v2.0.0-beta.1 and so on).
# Only the Windows zip is replaced; the macOS files stay as the macOS build
# left them. The release is created here only if no build has made it yet.
name: Windows build

env:
  # The pre-release the Windows zip joins. It must match ATLAS_PRERELEASE in
  # macos.yml, since both workflows publish to the same release.
  ATLAS_PRERELEASE: beta.1

on:
  push:
    branches:
      - Windows
    # A push that only changes documentation does not need a new build.
    paths-ignore:
      - '**.md'
      - 'docs/**'

# A newer push cancels the build still running for an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    # Visual Studio 2022 with the Windows SDK, whose MIDL generates the NVDA
    # controller stub during the build.
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      # Adds the zip to the beta release (and creates it when it is missing).
      contents: write
    steps:
      - uses: actions/checkout@v7

      # .gitmodules marks the reference-test submodules update = none, so this
      # fetches only the four the plugin needs (JUCE, nlohmann json,
      # concurrentqueue and KISS FFT), shallow.
      - name: Fetch submodules
        run: git submodule update --init --jobs 4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DATLAS_MSVC_COMPILE_JOBS=3

      # The runner has 4 cores and 16 GB of RAM, and each compiler on a unity
      # file can use several GB (see CLAUDE.md): one project at a time, with
      # three compilers inside it.
      - name: Build
        run: cmake --build build --config Release --parallel 1 --target Atlas_VST3

      # The whole bundle folder: the DLL under Contents/x86_64-win and the
      # Tape effect's clips under Contents/Resources/Tape.
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(Atlas VERSION (\S+)').Matches[0].Groups[1].Value
          $name = "Atlas-$version-$env:ATLAS_PRERELEASE-Windows-VST3"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Atlas_artefacts/Release/VST3/Atlas.vst3 -DestinationPath "dist/$name.zip"
          Get-Item "dist/$name.zip" | Select-Object Name, Length
          Add-Content -Path $env:GITHUB_ENV -Value "ATLAS_VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "ATLAS_ASSET=dist/$name.zip"

      - name: Publish the beta pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tag="v${ATLAS_VERSION}-${ATLAS_PRERELEASE}"
          # beta.1 reads as "beta 1" in the title and notes.
          beta="${ATLAS_PRERELEASE/./ }"
          title="Atlas ${ATLAS_VERSION} ${beta}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            # No macOS build has made the release yet: make it on this commit.
            # The macOS workflow moves the tag and rewrites the notes on its
            # next dev push.
            notes="Atlas ${ATLAS_VERSION} ${beta}, built from commit ${GITHUB_SHA} on the Windows branch (${GITHUB_SHA::7}: $(git log -1 --format=%s)). Every push replaces these files until the next beta.

          This is a beta release. Atlas is still being developed and tested: expect rough edges, keep copies of the presets you care about, and tell us what works and what does not.

          Atlas can get loud. Some oscillators, filters and effects reach well above 0 dBFS, so a limiter after Atlas, on the track or on the master, is recommended when you play it, especially on headphones.

          Contributions are welcome: bug reports, feature requests, pull requests, presets, wavetables and documentation, at ${REPOSITORY_URL}. Atlas is built to be played and programmed with a keyboard and a screen reader, so reports from VoiceOver and Windows screen reader users are especially valuable.

          The Windows zip holds the Atlas.vst3 folder: copy the whole folder into C:\\Program Files\\Common Files\\VST3 and rescan plug-ins in your host."
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
            gh release create "$tag" --verify-tag --prerelease --latest=false --title "$title" --notes "$notes"
          fi
          # --clobber replaces the previous Windows zip and leaves every other asset alone.
          gh release upload "$tag" "$ATLAS_ASSET" --clobber
