# Builds Atlas for macOS (VST3, AU and a .pkg installer) and for Windows (VST3
# and an .exe installer) on every push to dev or main. A push to dev publishes
# all of it as the current pre-release on the Releases page (v2.0.0-beta.1,
# v2.0.0-rc.1 and so on, see ATLAS_PRERELEASE below); a push to main publishes
# it as the release of the version in CMakeLists.txt (v2.0.0, "Atlas v2.0.0"),
# marked latest. Both installers also install the Factory banks and every
# library's folders (installer/stage_library.cmake). The two builds run side
# by side; the release is touched only once both have succeeded, so its files
# always come from one commit. Each publish replaces the files of the one
# before, and the release's tag moves to the commit it was built from; bumping
# ATLAS_PRERELEASE starts a new pre-release, and bumping the version in
# CMakeLists.txt a new release.
name: Build and publish

env:
  # The pre-release the dev branch publishes: its tag is v<version>-<this>,
  # its title "Atlas <version> beta N" or "Atlas <version> RC N". Bump it for
  # the next one, and write what changed since the one before in
  # docs/releases/v<version>-<this>.md, which the publish job puts at the top
  # of the release notes.
  ATLAS_PRERELEASE: rc.5
  # true on main (and a run by hand on main): the build is the release itself.
  ATLAS_OFFICIAL: ${{ github.ref == 'refs/heads/main' }}

on:
  push:
    branches:
      - dev
      - main
    # A push that only changes documentation does not need a new build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Run by hand from the Actions tab to rebuild and republish the head of dev
  # or main, for example after a force-push, which starts no run.
  workflow_dispatch:

# A newer push cancels the build still running for an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # .gitmodules marks the reference-test submodules update = none, so this
      # fetches only the five the plugin needs (JUCE, nlohmann json,
      # concurrentqueue, KISS FFT and espeak-ng), shallow.
      - name: Fetch submodules
        run: git submodule update --init --jobs 4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DATLAS_OFFICIAL_RELEASE=${{ env.ATLAS_OFFICIAL }}

      # The runner has 3 cores and 7 GB of RAM, and one compile job can use
      # several GB (see CLAUDE.md), so build with 2 jobs.
      - name: Build
        run: cmake --build build --config Release --parallel 2 --target Atlas_VST3 Atlas_AU

      # ditto keeps the bundles' symlinks, permissions and signatures.
      - name: Package
        run: |
          version=$(sed -n 's/^project(Atlas VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          if [ "$ATLAS_OFFICIAL" = true ]; then
            name="Atlas-${version}-macOS"
          else
            name="Atlas-${version}-${ATLAS_PRERELEASE}-macOS"
          fi
          installer/macos/build_pkg.sh build dist
          [ "dist/Atlas-${version}-macOS.pkg" = "dist/${name}.pkg" ] || mv "dist/Atlas-${version}-macOS.pkg" "dist/${name}.pkg"
          ditto -c -k --sequesterRsrc --keepParent build/Atlas_artefacts/Release/VST3/Atlas.vst3 "dist/${name}-VST3.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Atlas_artefacts/Release/AU/Atlas.component "dist/${name}-AU.zip"
          # File attributes in a payload become stray ._ entries, so flag them.
          pkgutil --expand "dist/${name}.pkg" "$RUNNER_TEMP/expanded"
          for component in "$RUNNER_TEMP"/expanded/*.pkg; do
            if gunzip -dc < "$component/Payload" | cpio -t 2> /dev/null | grep '/\._' > /dev/null; then
              echo "::warning::$(basename "$component") has ._ attribute files in its payload"
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    # Visual Studio 2022, the Windows SDK (its MIDL generates the NVDA
    # controller stub during the build) and Inno Setup come with the image.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Fetch submodules
        run: git submodule update --init --jobs 4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DATLAS_MSVC_COMPILE_JOBS=3 -DATLAS_OFFICIAL_RELEASE=${{ env.ATLAS_OFFICIAL }}

      # The runner has 4 cores and 16 GB of RAM, and each compiler on a unity
      # file can use several GB (see CLAUDE.md): one project at a time, with
      # three compilers inside it.
      - name: Build
        run: cmake --build build --config Release --parallel 1 --target Atlas_VST3

      # The zip holds the whole bundle folder (the DLL under
      # Contents/x86_64-win, the Tape effect's clips under
      # Contents/Resources/Tape and espeak-ng's data under
      # Contents/Resources/espeak-ng-data); the installer puts that folder
      # into the system VST3 folder and the staged library into the user's
      # Atlas folder (installer/windows/Atlas.iss).
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(Atlas VERSION (\S+)').Matches[0].Groups[1].Value
          $name = if ($env:ATLAS_OFFICIAL -eq 'true') { "Atlas-$version-Windows" } else { "Atlas-$version-$env:ATLAS_PRERELEASE-Windows" }
          New-Item -ItemType Directory -Force dist | Out-Null
          cmake -DDESTINATION=build/library -P installer/stage_library.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build/Atlas_artefacts/Release/VST3/Atlas.vst3 -DestinationPath "dist/$name-VST3.zip"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DOutputName=$name" installer\windows\Atlas.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Moves the release's tag and updates the release.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          version=$(sed -n 's/^project(Atlas VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          if [ "$ATLAS_OFFICIAL" = true ]; then
            tag="v${version}"
            title="Atlas v${version}"
            stage=""
            kind=(--prerelease=false --latest)
          else
            tag="v${version}-${ATLAS_PRERELEASE}"
            # beta.1 reads as "beta 1" in the title and notes, rc.1 as "RC 1".
            beta="${ATLAS_PRERELEASE/./ }"
            beta="${beta/#rc /RC }"
            title="Atlas ${version} ${beta}"
            case "$ATLAS_PRERELEASE" in
              rc.*) stage="This is a release candidate: Atlas ${version} as it is meant to ship, unless testing finds something that has to change first. Keep copies of the presets you care about, and tell us what works and what does not." ;;
              *) stage="This is a beta release. Atlas is still being developed and tested: expect rough edges, keep copies of the presets you care about, and tell us what works and what does not." ;;
            esac
            kind=(--prerelease --latest=false)
          fi
          # What changed since the release before, written in
          # docs/releases/<tag>.md when ATLAS_PRERELEASE or the version was
          # bumped; an older one republished by hand may have none.
          changes=""
          if [ -f "docs/releases/${tag}.md" ]; then
            changes="$(cat "docs/releases/${tag}.md")"$'\n\n'
          fi
          notes="${changes}${stage}

          Atlas can get loud. Some oscillators, filters and effects reach well above 0 dBFS, so a limiter after Atlas, on the track or on the master, is recommended when you play it, especially on headphones.

          Contributions are welcome: bug reports, feature requests, pull requests, presets, wavetables and documentation, at ${REPOSITORY_URL}. Atlas is built to be played and programmed with a keyboard and a screen reader, so reports from VoiceOver and Windows screen reader users are especially valuable.

          macOS: the .pkg installs the VST3 and the Audio Unit in /Library/Audio/Plug-Ins, and the Factory presets in Documents/Blind Producers Plugins/Atlas. It is not signed, so the first time macOS blocks it: open System Settings > Privacy & Security and click Open Anyway. The macOS zips hold the bare plug-ins for copying by hand. They are not notarized either, so after unzipping, clear the quarantine flag (xattr -dr com.apple.quarantine Atlas.vst3, and the same for Atlas.component) or hosts refuse to load them.

          Windows: the .exe installs Atlas.vst3 into C:\\Program Files\\Common Files\\VST3 (or a folder you choose), and the Factory presets in Documents\\Blind Producers Plugins\\Atlas, and can be removed from Apps & features. It is not signed, so SmartScreen may ask once: choose More info, then Run anyway. The Windows zip holds the bare Atlas.vst3 folder for copying by hand into your VST3 folder. Rescan plug-ins in your host afterwards."
          ls -l dist
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --title "$title" --notes "$notes" "${kind[@]}"
          else
            gh release create "$tag" --verify-tag "${kind[@]}" --title "$title" --notes "$notes"
          fi
          gh release upload "$tag" dist/*
